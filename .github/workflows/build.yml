name: Build APK - One File Builder V2

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Create project files
        run: |
          rm -rf app 2>/dev/null || true
          mkdir -p app/src/main/java/com/xautrader/pure
          mkdir -p app/src/main
          
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "XAUTraderPureAndroid"
          include(":app")
          EOF
          
          cat > build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF
          
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRResources=true
          EOF
          
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.xautrader.pure"
              compileSdk = 34
              defaultConfig { applicationId = "com.xautrader.pure"; minSdk = 24; targetSdk = 34; versionCode = 5; versionName = "5.0-OANDA-FREE" }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.compose.ui:ui:1.6.0")
              implementation("androidx.compose.material3:material3:1.2.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF
          
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="XAU Trader" android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cat > app/src/main/java/com/xautrader/pure/MainActivity.kt <<'KOTLIN_EOF'
          package com.xautrader.pure
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.*
          import okhttp3.*
          import org.json.JSONObject
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState); setContent { XAUTraderApp() } }
          }
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun XAUTraderApp() {
              var token by remember { mutableStateOf("") }
              var accountId by remember { mutableStateOf("") }
              var log by remember { mutableStateOf("OANDA FREE\nReady\n") }
              var balance by remember { mutableStateOf("0.0") }
              val scope = rememberCoroutineScope()
              val client = remember { OkHttpClient() }
              fun addLog(s: String) { log = (s + "\n" + log).take(4000) }
              Scaffold(topBar = { TopAppBar(title = { Text("XAU Trader OANDA FREE") }) }) { pad ->
                  Column(Modifier.padding(pad).padding(16.dp).fillMaxSize(), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                      OutlinedTextField(token, { token = it }, label = { Text("OANDA Token") }, modifier = Modifier.fillMaxWidth())
                      OutlinedTextField(accountId, { accountId = it }, label = { Text("Account ID") }, modifier = Modifier.fillMaxWidth())
                      Text("Balance: $balance")
                      Button(onClick = {
                          scope.launch(Dispatchers.IO) {
                              try {
                                  val req = Request.Builder().url("https://api-fxpractice.oanda.com/v3/accounts/${accountId}").header("Authorization", "Bearer $token").build()
                                  client.newCall(req).execute().use { r ->
                                      val b = r.body?.string() ?: ""
                                      if (r.isSuccessful) { val bal = JSONObject(b).getJSONObject("account").getString("balance"); balance = bal; addLog("Balance: $bal") } else addLog(b)
                                  }
                              } catch (e: Exception) { addLog(e.message ?: "err") }
                          }
                      }) { Text("Check Balance") }
                      Card(Modifier.weight(1f).fillMaxWidth()) { Text(log, Modifier.padding(10.dp)) }
                  }
              }
          }
          KOTLIN_EOF

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUTrader-APK-FIXED
          path: app/build/outputs/apk/debug/app-debug.apk
